name: Update data

on:
  schedule:
    - cron: '20 22 * * *'   # 22:20 UTC, after the US close
    - cron: '20 6 * * *'    # 06:20 UTC, European morning
  workflow_dispatch:
    inputs:
      only:
        description: 'Space-separated series ids to refresh (empty = all)'
        required: false
        default: ''
      no_crypto:
        description: 'Skip GeckoTerminal pairs'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r fetch/requirements.txt
      - name: Fetch
        run: |
          ARGS="${{ github.event.inputs.only }}"
          if [ "${{ github.event.inputs.no_crypto }}" = "true" ]; then ARGS="$ARGS --no-crypto"; fi
          python fetch/fetch_all.py $ARGS
      - name: Commit data
        run: |
          git config user.name "plslend-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push
          fi
      - name: Summary
        if: always()
        run: |
          echo '## Fetch status' >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          s = json.load(open('data/status.json'))
          print('| series | ok | source | last | n |'); print('|---|---|---|---|---|')
          for k, v in s['series'].items():
              print(f"| {k} | {'✅' if v.get('ok') else '❌'} | {v.get('source','')} | {v.get('last','')} | {v.get('n','')} |")
          print(); print('| pair | ok | pool | day | 4h |'); print('|---|---|---|---|---|')
          for k, v in s['crypto'].items():
              print(f"| {k} | {'✅' if v.get('ok') else '❌'} | {v.get('name','')} {v.get('pool','')} | {v.get('n_day','')} | {v.get('n_4h','')} |")
          PY
